services:
  postgres_db:
    container_name: postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: mypassword
      POSTGRES_USER: myuser
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: "k8s-file"
      #options:
      # max-size: "10m"
volumes:
  postgres_data:
    external: true
    name: postgres_data